<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dummy2</title>
    <link rel="stylesheet" href="index.css" />
    <style>
      .container {
        position: relative;
        width: 400px;
        height: 400px;
        border: 2px dashed #777575;
      }

      .item1 {
        position: absolute;
        width: 150px;
        height: 150px;
        background-color: #4b3095;
        border-radius: 10px;
        top: 50px;
        z-index: 2;
      }

      .item2 {
        width: 50px;
        height: 50px;
        position: absolute;
        background-color: #bb9e1d;
        border-radius:50%;
        left: 123px;
        top: 33px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item1"></div>
      <div class="item2"</div>
    </div>
  </body>
</html>
